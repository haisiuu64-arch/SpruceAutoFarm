
name: Build SpruceAutoFarm

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract ZIP
        run: unzip -o SpruceAutoFarmv3full.zip -d source

      - name: Build Mod
        run: |
          WRAPPER=$(find source -name gradlew -type f | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "Khong tim thay Gradle wrapper"
            exit 1
          fi
          cd "$(dirname "$WRAPPER")"
          chmod +x gradlew
          ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SpruceAutoFarm-JAR
          path: source/**/build/libs/*.jar
          if-no-files-found: error
